name: Notebook smoke run

on:
  pull_request:
    paths:
      - "notebooks/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/notebook-smoke.yml"
  push:
    branches: [main]
    paths:
      - "notebooks/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/notebook-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the pinned experiment and notebook runner
        run: python -m pip install -r requirements.txt nbformat==5.10.4 nbclient==0.10.2 ipykernel
      - name: Validate and execute the notebook on a smaller dataset
        run: python scripts/check_notebook.py --execute
      - name: Keep the executed notebook and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fraud-notebook-smoke
          path: outputs/
          if-no-files-found: ignore
          retention-days: 14
